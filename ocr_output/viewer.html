<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanda Mama Sanskrit OCR — Kraken Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #1a2234;
  --border-color: #2e3a52;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --gold: #f59e0b;
  --gold-glow: rgba(245, 158, 11, 0.35);
  --emerald: #10b981;
  --accent: #3b82f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
  border-bottom: 1px solid var(--border-color);
  padding: 16px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.logo-title h1 {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  color: #fbbf24;
  letter-spacing: 0.5px;
}
.logo-title p {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}
.model-pill {
  background: rgba(245, 158, 11, 0.15);
  border: 1px solid rgba(245, 158, 11, 0.4);
  color: #fde68a;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.page-nav {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 12px 28px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  align-items: center;
}
.page-btn {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.page-btn:hover {
  color: #fff;
  border-color: var(--accent);
  background: #1e293b;
}
.page-btn.active {
  background: var(--gold);
  color: #000;
  border-color: var(--gold);
  box-shadow: 0 0 12px var(--gold-glow);
}
.view-tabs {
  display: flex;
  gap: 6px;
  margin-left: auto;
}
.tab-btn {
  background: #1e293b;
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.tab-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
main {
  flex: 1;
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 20px;
  padding: 20px 28px;
  max-width: 1920px;
  margin: 0 auto;
  width: 100%;
}
.image-viewer {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
}
.viewer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.image-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: #090d16;
  border-radius: 8px;
  padding: 10px;
  overflow: auto;
  max-height: 82vh;
}
.image-container img {
  max-width: 100%;
  height: auto;
  border-radius: 6px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.text-viewer {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  max-height: 88vh;
}
.text-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
}
.copy-btn {
  background: #2563eb;
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.copy-btn:hover { background: #1d4ed8; }
.lines-list {
  margin-top: 14px;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 6px;
}
.line-card {
  background: #131b2e;
  border: 1px solid #23304a;
  border-radius: 8px;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: all 0.2s ease;
}
.line-card:hover {
  border-color: var(--gold);
  background: #1a253f;
}
.line-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
}
.line-badge {
  background: #1e3a8a;
  color: #93c5fd;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
}
.line-confidence {
  color: var(--emerald);
  font-weight: 600;
}
.line-sanskrit {
  font-family: 'Noto Serif Devanagari', serif;
  font-size: 18px;
  color: #fef08a;
  line-height: 1.5;
  margin-top: 2px;
}
.empty-line {
  color: #64748b;
  font-style: italic;
  font-size: 13px;
}
</style>
</head>
<body>
<header>
  <div class="logo-title">
    <h1>Chanda Mama Sanskrit OCR Studio</h1>
    <p>Kraken BLLA Baseline Polygon Segmentation &amp; PP-OCRv6 Recognition</p>
  </div>
  <div class="model-pill">20 Pages Analyzed</div>
</header>

<div class="page-nav">
  <div id="pageButtons" style="display: flex; gap: 8px;"></div>
  <div class="view-tabs">
    <button class="tab-btn active" onclick="switchView('comparison')">Side-by-Side Comparison</button>
    <button class="tab-btn" onclick="switchView('overlay')">Annotated Overlay</button>
    <button class="tab-btn" onclick="switchView('orig')">Original Image</button>
  </div>
</div>

<main>
  <div class="image-viewer">
    <div class="viewer-header">
      <h3 id="imageTitle">Visual Output</h3>
    </div>
    <div class="image-container">
      <img id="mainImage" src="" alt="OCR Visual Output">
    </div>
  </div>

  <div class="text-viewer">
    <div class="text-header">
      <div>
        <h3 id="textTitle">Transcribed Sanskrit Text</h3>
        <p style="font-size: 12px; color: var(--text-muted);" id="lineCount"></p>
      </div>
      <button class="copy-btn" onclick="copyFullText()">📋 Copy All Text</button>
    </div>
    <div class="lines-list" id="linesList"></div>
  </div>
</main>

let currentPage = 1;
let currentView = 'comparison';

function init() {
  const nav = document.getElementById('pageButtons');
  data.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (idx === 0 ? ' active' : '');
    btn.textContent = p.name;
    btn.onclick = () => selectPage(p.page);
    btn.id = `btn-page-${p.page}`;
    nav.appendChild(btn);
  });
  renderPage();
}

function selectPage(pageNum) {
  currentPage = pageNum;
  document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-page-${pageNum}`).classList.add('active');
  renderPage();
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderPage();
}

function renderPage() {
  const p = data.find(item => item.page === currentPage) || data[0];
  const imgElem = document.getElementById('mainImage');
  const titleElem = document.getElementById('imageTitle');

  if (currentView === 'comparison') {
    imgElem.src = p.comparison_img;
    titleElem.textContent = `${p.name} — Side-by-Side Manuscript & Sanskrit Output`;
  } else if (currentView === 'overlay') {
    imgElem.src = p.overlay_img;
    titleElem.textContent = `${p.name} — Detected Line Polygons & Baselines`;
  } else {
    imgElem.src = p.orig_img;
    titleElem.textContent = `${p.name} — Original Image`;
  }

  document.getElementById('textTitle').textContent = `Transcribed Text — ${p.name}`;
  const validLines = p.lines.filter(l => l.text);
  document.getElementById('lineCount').textContent = `${validLines.length} text lines recognized (${p.lines.length} total segments)`;

  const list = document.getElementById('linesList');
  list.innerHTML = '';
  p.lines.forEach(l => {
    const card = document.createElement('div');
    card.className = 'line-card';
    const conf = l.confidence ? `${Math.round(l.confidence * 100)}% confidence` : '';
    card.innerHTML = `
      <div class="line-meta">
        <span class="line-badge">Line #${l.num}</span>
        <span class="line-confidence">${conf}</span>
      </div>
      <div class="${l.text ? 'line-sanskrit' : 'empty-line'}">${l.text || '(empty segment / separator)'}</div>
    `;
    list.appendChild(card);
  });
}

function copyFullText() {
  const p = data.find(item => item.page === currentPage) || data[0];
  navigator.clipboard.writeText(p.text).then(() => {
    alert(`Copied full Sanskrit text for ${p.name} to clipboard!`);
  });
}

window.onload = init;
</script>
